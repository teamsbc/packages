name: Update Fedora kernel sources

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-kernel-sources
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/teamsbc/ci-packages:fedora-46
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install updater dependencies
        run: dnf5 install -y python3-rpm fedora-repos-rawhide
      - name: Discover and verify Fedora source RPM
        run: /usr/bin/python3 .github/scripts/update-kernel-sources.py
      - name: Commit updated pins
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add virt/kernel/source.env rpi4/kernel/source.env rpi5/kernel/source.env
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: update Fedora kernels'
            git push origin HEAD:refs/heads/main
          fi
      # Dispatch even when unchanged so a previous failed dispatch or build can
      # be retried from the published repository revisions on the next run.
      - name: Dispatch changed-package build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"main","inputs":{"changed_only":"true"}}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/dispatches"
